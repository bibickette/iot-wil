---
apiVersion: apps/v1
kind: Application
metadata:
  name: iot-argo-app
  labels:
    app: iot-argo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-argo-app
  template:
    metadata:
      labels:
        app: iot-argo-app
    spec:
      containers:
        - name: app
          image: wil42/playground
          ports:
            - containerPort: 8888  
---

apiVersion: v1
kind: Service
metadata:
  name: iot-argo-service
spec:
  type: NodePort
  selector:
    app: iot-argo-app
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888