---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-argo-app
  namespace: iot-argo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-argo-app
  template:
    metadata:
      labels:
        app: iot-argo-app
    spec:
      containers:
        - name: app
          image: "wil42/playground:v1"
          ports:
            - containerPort: 8888
---

apiVersion: v1
kind: Service
metadata:
  name: iot-argo-service
  namespace: iot-argo
spec:
  selector:
    app: iot-argo-app
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888