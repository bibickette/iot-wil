apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-wil-app
  namespace: dev
spec:
  ingressClassName: traefik
  rules:
    - host: localhost
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: wil-app-hub-service 
                port:
                  number: 8888
